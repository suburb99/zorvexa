<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zorvexa – AI that builds</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='72' font-size='64' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'>Z</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--mute:#737373;--s1:#f6f6f6;--s2:#ebebeb;--line:rgba(128,128,128,.26);box-sizing:border-box}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--mute:#8f8f8f;--s1:#111;--s2:#1e1e1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:10px;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:38px;height:38px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--s1)}
.app{display:flex;height:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#side{width:264px;flex:none;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.mark{width:32px;height:32px;background:var(--fg);color:var(--bg);display:grid;place-items:center;border-radius:9px;font-weight:800;font-size:18px;letter-spacing:-.04em}
.logo b{display:block;font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.logo span{font-size:12px;color:var(--mute)}
#newp{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);padding:10px 12px;font-weight:600;border-radius:12px}
.lbl{font-size:12px;color:var(--mute);padding:8px 8px 2px}
#plist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.pi{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer}
.pi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi:hover,.pi.on{background:var(--s2)}
.pi.on{font-weight:600}
.pi i{font-style:normal;color:var(--mute);width:22px;height:22px;display:grid;place-items:center;border-radius:6px;opacity:0}
.pi:hover i,.pi.on i{opacity:1}
.pi i:hover{background:var(--line)}
.free{font-size:12px;color:var(--mute);padding:10px 8px 0;border-top:1px solid var(--line)}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:56px}
#menu{display:none}
#ptitle{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.seg{display:flex;background:var(--s1);padding:3px;border-radius:11px;gap:2px;margin-right:6px}
.seg button,.tabbar button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
main{flex:1;min-height:0;display:flex}
.pane{display:none;flex:1;min-width:0;flex-direction:column;min-height:0}
.pane.on{display:flex}
.tabbar{display:none}
#log{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.r{display:flex;gap:10px;align-items:flex-start}
.r.u{justify-content:flex-end}
.av{width:28px;height:28px;flex:none;background:var(--fg);color:var(--bg);border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px}
.m{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;padding-top:2px}
.u .m{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:85%}
.m.err{border:1px dashed var(--fg);border-radius:12px;padding:10px 12px}
.chip{display:inline-flex;margin:8px 6px 0 0;padding:3px 10px;border:1px solid var(--line);border-radius:99px;font:12px ui-monospace,Menlo,monospace;background:var(--s1)}
.dots{display:inline-flex;gap:4px;padding:10px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--fg);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}}
.empty{margin:auto;max-width:440px;text-align:center;padding:10px}
.empty .mark{width:56px;height:56px;font-size:30px;border-radius:16px;margin:0 auto 18px}
.empty h2{font-size:30px;letter-spacing:-.04em;line-height:1.08;margin:0 0 8px;font-weight:800}
.empty p{color:var(--mute);margin:0 0 20px}
.ideas{display:grid;gap:8px}
.ideas button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.ideas button:hover{border-color:var(--fg)}
.comp{margin:0 14px 14px;border:1px solid var(--line);border-radius:18px;background:var(--s1);padding:10px 10px 8px}
.comp:focus-within{border-color:var(--fg)}
.comp textarea{width:100%;resize:none;background:none;border:0;outline:0;padding:4px 6px;height:44px;max-height:160px}
.crow{display:flex;align-items:center;gap:8px}
#model{min-width:0;max-width:230px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px}
.sp{flex:1}
.modes{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px;width:max-content;margin:0 0 6px 4px}
.modes button{padding:4px 12px;border-radius:99px;font-size:13px;color:var(--mute);font-weight:600}
.modes button.on{background:var(--fg);color:var(--bg)}
.m[data-md]::before{content:attr(data-md);display:block;font-size:12px;color:var(--mute)}
.chip.go{cursor:pointer;background:var(--fg);color:var(--bg);font:600 13px "Bricolage Grotesque",system-ui,sans-serif;padding:5px 12px}
#send{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
#send:disabled{opacity:.35}
.fbar{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 8px 0 4px}
#files{flex:1;display:flex;overflow:auto;min-width:0}
#files button{padding:14px 12px 12px;font:13px ui-monospace,Menlo,monospace;color:var(--mute);border-radius:0;border-bottom:2px solid transparent;white-space:nowrap}
#files button.on{color:var(--fg);border-bottom-color:var(--fg)}
#st{font-size:12px;color:var(--mute);padding:0 6px}
#code{flex:1;width:100%;border:0;outline:0;background:var(--bg);padding:14px 16px;font:13px/1.65 ui-monospace,Menlo,Consolas,monospace;resize:none;tab-size:2;white-space:pre;overflow:auto}
.pbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.url{flex:1;min-width:0;background:var(--s1);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--mute)}
#stage{flex:1;min-height:0;display:flex;justify-content:center;background:var(--s1)}
#frame{border:0;background:#fff;width:100%;height:100%}
#stage.phone{padding:18px}
#stage.phone #frame{width:390px;max-width:100%;border-radius:28px;border:8px solid var(--fg)}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:22px;max-width:420px;width:calc(100% - 32px);border-radius:20px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
dialog p{color:var(--mute);margin:0 0 14px;font-size:14px}
dialog input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s1);margin-bottom:14px;outline:0}
dialog input:focus{border-color:var(--fg)}
dialog a{color:var(--fg)}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn{padding:9px 16px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;display:none;z-index:30;max-width:90%;font-size:14px}
@media(min-width:1000px){#chat{display:flex;flex:none;width:420px;border-right:1px solid var(--line)}}
@media(max-width:999px){
#side{position:fixed;z-index:20;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
body.nav #side{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none}
body.nav .scrim{display:block}
#menu{display:grid}
.seg,#devb{display:none}
.tabbar{display:flex;border-top:1px solid var(--line)}
.tabbar button{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:8px;border-radius:0}
.tabbar button.on{color:var(--fg)}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="16.5" r="4"/><path d="M10.8 13.2L20 4M16 8l3 3"/></symbol><symbol id="i-inv" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/></symbol><symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-re" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol><symbol id="i-ph" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-cp" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol><symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol></svg>
<div class="app">
<aside id="side">
  <div class="logo"><div class="mark">Z</div><div><b>Zorvexa</b><span>AI that builds.</span></div></div>
  <button id="newp"><svg class="i"><use href="#i-plus"/></svg>New project</button>
  <div class="lbl">Projects</div>
  <div id="plist"></div>
  <div class="free">Free models through OpenRouter. Your key stays on this device.</div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="work">
<header class="top">
  <button class="ib" id="menu" aria-label="Projects"><svg class="i"><use href="#i-menu"/></svg></button>
  <div id="ptitle"></div>
  <div class="seg"><button data-t="codep"><svg class="i"><use href="#i-code"/></svg>Code</button><button data-t="prev"><svg class="i"><use href="#i-eye"/></svg>Preview</button></div>
  <button class="ib" id="theme" aria-label="Invert colors"><svg class="i"><use href="#i-inv"/></svg></button>
  <button class="ib" id="setb" aria-label="OpenRouter key"><svg class="i"><use href="#i-key"/></svg></button>
</header>
<main>
  <section class="pane on" id="chat">
    <div id="log"></div>
    <div class="comp"><div class="modes" id="modes"><button data-m="auto">Auto</button><button data-m="discuss">Discuss</button><button data-m="build">Build</button></div><textarea id="inp" placeholder="Describe what to build" rows="1"></textarea>
      <div class="crow"><select id="model" aria-label="Free model"><option>Loading free models…</option></select><span class="sp"></span><button id="send" aria-label="Build"><svg class="i"><use href="#i-up"/></svg></button></div></div>
  </section>
  <section class="pane" id="codep">
    <div class="fbar"><div id="files"></div><span id="st"></span><button class="ib" id="copy" aria-label="Copy code"><svg class="i"><use href="#i-cp"/></svg></button><button class="ib" id="dl" aria-label="Download file"><svg class="i"><use href="#i-dl"/></svg></button></div>
    <textarea id="code" spellcheck="false" placeholder="Code appears here after your first build."></textarea>
  </section>
  <section class="pane" id="prev">
    <div class="pbar"><button class="ib" id="run" aria-label="Reload preview"><svg class="i"><use href="#i-re"/></svg></button><div class="url">Live preview</div><button class="ib" id="devb" aria-label="Toggle phone size"><svg class="i"><use href="#i-ph"/></svg></button></div>
    <div id="stage"><iframe id="frame" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="Preview"></iframe></div>
  </section>
</main>
<nav class="tabbar"><button data-t="chat" class="on"><svg class="i"><use href="#i-chat"/></svg>Chat</button><button data-t="codep"><svg class="i"><use href="#i-code"/></svg>Code</button><button data-t="prev"><svg class="i"><use href="#i-eye"/></svg>Preview</button></nav>
</div></div>
<dialog id="dlg">
  <h3>OpenRouter key</h3>
  <p>Free models need a free OpenRouter key. It stays in this browser and is sent only to OpenRouter. Get one at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>.</p>
  <input id="key" type="password" placeholder="sk-or-..." autocomplete="off">
  <div class="row"><button class="btn" id="clr">Remove</button><button class="btn" id="cancel">Close</button><button class="btn solid" id="save">Save</button></div>
</dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={projects:LS.get('zx_projects',[]),cur:LS.get('zx_cur',null),key:LS.get('zx_key',''),model:LS.get('zx_model',''),theme:LS.get('zx_theme','light'),file:null};
let busy=false,PM='build';
const SYS='You are Zorvexa, an AI that builds small web apps. Reply with one or two short sentences, then output every file in full, each inside <file name="index.html">...</file> tags. Prefer one self-contained index.html with inline CSS and JS, mobile-first, no external resources except cdnjs.cloudflare.com scripts. When changing an app, return the full updated files. Never use markdown code fences.';
const DSYS='You are Zorvexa, a friendly senior engineer and product partner. In this mode you discuss: answer questions, explain how things work, weigh options, and help the user shape what they want. Be concise and concrete. Never write full files and never use <file> tags; short snippets are fine. When the idea is clear, suggest they say "build it".';
const IDEAS=['A tip calculator with a split-bill option','A habit tracker with streaks','A pomodoro timer with a dark mode'];

function save(){LS.set('zx_projects',S.projects);LS.set('zx_cur',S.cur)}
function proj(){return S.projects.find(p=>p.id===S.cur)}
function newProj(){const p={id:Date.now().toString(36),name:'Project '+(S.projects.length+1),msgs:[],files:{}};S.projects.push(p);S.cur=p.id;save();return p}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;LS.set('zx_theme',t)}
function tab(t){const w=matchMedia('(min-width:1000px)').matches;if(w&&t==='chat')t=S.right||'prev';if(t!=='chat')S.right=t;document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===t));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}

function renderProjects(){const l=$('#plist');l.innerHTML='';S.projects.slice().reverse().forEach(p=>{const b=document.createElement('div');b.className='pi'+(p.id===S.cur?' on':'');b.innerHTML='<span></span><i title="Delete">×</i>';b.firstChild.textContent=p.name;b.onclick=e=>{if(e.target.tagName==='I'){delProj(p.id);return}S.cur=p.id;save();S.file=null;renderProjects();renderChat();renderFiles();preview();document.body.classList.remove('nav')};l.appendChild(b)});$('#ptitle').textContent=proj().name}
function renderChat(){
  const l=$('#log');l.innerHTML='';const p=proj();
  if(!p.msgs.length){
    l.innerHTML='<div class="empty"><div class="mark">Z</div><h2>What should we build?</h2><p>Describe an app. Zorvexa writes it, runs it, and shows you the code.</p><div class="ideas"></div></div>';
    IDEAS.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('#inp').value=t;$('#inp').focus()};l.querySelector('.ideas').appendChild(b)});
  }
  p.msgs.forEach(m=>addMsg(m.role==='user'?'u':'a',m.content,m.err,m.fl,m.md));
  l.scrollTop=l.scrollHeight;
}
function paint(b,note,files){b.textContent=note;(files||[]).forEach(n=>{const c=document.createElement('span');c.className='chip';c.textContent=n;b.appendChild(c)})}
function addMsg(cls,text,err,fl,md){const r=document.createElement('div');r.className='r '+cls;if(cls==='a')r.innerHTML='<div class="av">Z</div>';const d=document.createElement('div');d.className='m'+(err?' err':'');if(md)d.dataset.md=md;paint(d,text,fl);r.appendChild(d);$('#log').appendChild(r);$('#log').scrollTop=1e9;return d}
function renderFiles(){
  const p=proj(),names=Object.keys(p.files),f=$('#files');f.innerHTML='';
  if(!names.includes(S.file))S.file=names[0]||null;
  names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n===S.file?'on':'';b.onclick=()=>{S.file=n;renderFiles()};f.appendChild(b)});
  $('#code').value=S.file?p.files[S.file]:'';
}
function build(files){
  let h=files['index.html']||files[Object.keys(files).find(n=>n.endsWith('.html'))];
  if(!h)return '';
  h=h.replace(/<link[^>]+href=["']([^"']+)["'][^>]*>/g,(m,f)=>files[f]!=null?'<style>'+files[f]+'</style>':m);
  h=h.replace(/<script([^>]*)src=["']([^"']+)["']([^>]*)><\/script>/g,(m,a,f)=>files[f]!=null?'<script>'+files[f]+'<\/script>':m);
  return h;
}
function preview(){$('#frame').srcdoc=build(proj().files)||'<body style="font-family:sans-serif;padding:24px;color:#666">Nothing to preview yet. Build something first.</body>'}
function parse(t){if(PM!=='build')return{files:{},note:t.trim()};
  const files={};let note=t.replace(/<file name="([^"]+)">\n?([\s\S]*?)(?:<\/file>|$)/g,(m,n,c)=>{files[n]=c.replace(/\n$/,'');return ''}).trim();
  return{files,note};
}

async function loadModels(){
  const sel=$('#model');
  try{
    const r=await fetch('https://openrouter.ai/api/v1/models');const j=await r.json();
    const ok=j.data.filter(m=>!m.architecture||!m.architecture.output_modalities||m.architecture.output_modalities.includes('text'));
    const isF=m=>m.pricing&&Number(m.pricing.prompt)===0&&Number(m.pricing.completion)===0;
    const nm=m=>m.name.replace(/\s*\(free\)/i,'');
    const free=ok.filter(isF).sort((a,b)=>(b.context_length||0)-(a.context_length||0));
    const paid=ok.filter(m=>!isF(m)&&m.pricing&&Number(m.pricing.prompt)>0).sort((a,b)=>a.name.localeCompare(b.name));
    if(!free.length&&!paid.length)throw 0;
    sel.innerHTML='';
    const grp=(l,a,f)=>{if(!a.length)return;const g=document.createElement('optgroup');g.label=l;a.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=f(m);g.appendChild(o)});sel.appendChild(g)};
    grp('Free',free,nm);
    grp('Paid (needs OpenRouter credit)',paid,m=>nm(m)+' · $'+(Number(m.pricing.prompt)*1e6).toFixed(2)+'/M in');
    if(free.concat(paid).some(m=>m.id===S.model))sel.value=S.model;else{S.model=(free[0]||paid[0]).id;LS.set('zx_model',S.model)}
  }catch(e){sel.innerHTML='<option value="">Could not load models. Check your connection.</option>'}
}

async function send(forced){
  const inp=$('#inp'),text=inp.value.trim();
  if(!text||busy)return;
  if(!S.key){$('#dlg').showModal();return toast('Add your OpenRouter key first')}
  if(!S.model)return toast('No model selected yet');
  const p=proj();
  if(!p.msgs.length)p.name=text.slice(0,26);
  p.msgs.push({role:'user',content:text});inp.value='';inp.style.height='44px';
  renderProjects();renderChat();
  const mode=forced||(S.mode==='auto'?detect(text,p):S.mode);PM=mode;const md=mode==='build'?'Build mode':'Discussion';const dumpAll=Object.entries(p.files).map(([n,c])=>'<file name="'+n+'">\n'+c+'\n</file>').join('\n');
  const dump=mode==='build'?dumpAll:dumpAll.slice(0,12000);const messages=[{role:'system',content:mode==='build'?SYS:DSYS},...p.msgs.slice(0,-1).filter(m=>!m.err).slice(-8).map(m=>({role:m.role,content:m.content})),{role:'user',content:text+(dump?'\n\nCurrent files:\n'+dump:'')}];
  busy=true;$('#send').disabled=true;
  const bub=addMsg('a','',false,null,md);bub.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';let full='';
  try{
    const h={'Authorization':'Bearer '+S.key,'Content-Type':'application/json','X-Title':'Zorvexa'};
    if(location.protocol.startsWith('http'))h['HTTP-Referer']=location.origin;
    const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:h,body:JSON.stringify({model:S.model,messages,stream:true})});
    if(!res.ok){
      let msg='';try{msg=(await res.json()).error.message}catch(e){}
      if(res.status===401)throw new Error('OpenRouter rejected your key. Open Key and paste it again.');
      if(res.status===429)throw new Error('This free model hit its rate limit. Wait a minute or pick another model.');
      if(res.status===402)throw new Error('This model needs credit on your OpenRouter account. Pick another free model.');
      throw new Error(msg||'Request failed ('+res.status+'). Try another model.');
    }
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',last=0;
    while(true){
      const{done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        if(!ln.startsWith('data: '))continue;const d=ln.slice(6).trim();if(d==='[DONE]')continue;
        let j;try{j=JSON.parse(d)}catch(e){continue}
        if(j.error)throw new Error(j.error.message||'The model returned an error. Try another one.');
        const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c)full+=c;
      }
      if(Date.now()-last>250){last=Date.now();const{files,note}=parse(full);if(note||Object.keys(files).length)paint(bub,note,Object.keys(files));if(Object.keys(files).length){Object.assign(p.files,files);renderFiles()}}
    }
    const{files,note}=parse(full);
    if(!Object.keys(files).length&&!note)throw new Error('The model sent nothing back. Try again or pick another model.');
    Object.assign(p.files,files);
    const reply=note||(Object.keys(files).length?'Done. Your app is ready.':'');
    const fl=Object.keys(files);p.msgs.push({role:'assistant',content:reply,fl,md});paint(bub,reply,fl);if(mode==='discuss'&&reply){const gb=document.createElement('button');gb.className='chip go';gb.textContent='Build this';gb.onclick=()=>{gb.remove();$('#inp').value='Build what we just discussed.';send('build')};bub.appendChild(document.createElement('br'));bub.appendChild(gb)}
    save();renderFiles();preview();
    if(Object.keys(files).length)tab('prev');
  }catch(e){
    bub.remove();p.msgs.push({role:'assistant',content:e.message||'Something went wrong.',err:true});save();renderChat();
  }
  busy=false;$('#send').disabled=false;
}

$('#send').onclick=()=>send();
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:1000px)').matches){e.preventDefault();send()}});
$('#inp').addEventListener('input',e=>{e.target.style.height='44px';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
$('#theme').onclick=()=>setTheme(S.theme==='dark'?'light':'dark');
$('#setb').onclick=()=>{$('#key').value=S.key;$('#dlg').showModal()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{S.key=$('#key').value.trim();LS.set('zx_key',S.key);$('#dlg').close();toast(S.key?'Key saved':'Key removed')};
$('#clr').onclick=()=>{S.key='';LS.set('zx_key','');$('#key').value='';$('#dlg').close();toast('Key removed')};
$('#model').onchange=e=>{S.model=e.target.value;LS.set('zx_model',S.model)};

$('#newp').onclick=()=>{newProj();renderProjects();renderChat();renderFiles();preview();tab('chat');document.body.classList.remove('nav')};
function delProj(id){if(!confirm('Delete this project?'))return;S.projects=S.projects.filter(p=>p.id!==id);if(!S.projects.length)newProj();if(!S.projects.some(p=>p.id===S.cur))S.cur=S.projects[0].id;save();S.file=null;renderProjects();renderChat();renderFiles();preview()}
$('#menu').onclick=()=>document.body.classList.add('nav');$('#scrim').onclick=()=>document.body.classList.remove('nav');
$('#devb').onclick=()=>$('#stage').classList.toggle('phone');
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab(b.dataset.t);if(b.dataset.t==='prev')preview()});
let ct;$('#code').addEventListener('input',e=>{const p=proj();if(!S.file)return;p.files[S.file]=e.target.value;save();clearTimeout(ct);ct=setTimeout(preview,600);$('#st').textContent='Saved'});
$('#run').onclick=preview;
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#code').value);toast('Copied')}catch(e){toast('Copy failed. Select the text instead.')}};
$('#dl').onclick=()=>{if(!S.file)return toast('Nothing to download yet');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#code').value],{type:'text/plain'}));a.download=S.file;a.click()};

const PH={auto:'Ask a question or describe what to build',discuss:'Talk through your idea',build:'Describe what to build'};
function setMode(m){S.mode=m;LS.set('zx_mode',m);document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#inp').placeholder=PH[m]}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function detect(t,p){
  const s=t.trim().toLowerCase();
  const v='make|build|create|add|change|fix|update|remove|delete|redesign|rewrite|implement|generate|turn|set|replace|rename|move|style|improve|refactor|swap|resize|center';
  if(new RegExp('^(please )?(can|could|would|will) you (please )?('+v+')\\b').test(s))return 'build';
  if(/^(let'?s|lets) (build|make|create|try|start)\b/.test(s)||/^(build it|do it|go ahead|ship it)\b/.test(s))return 'build';
  if(new RegExp('^(please )?('+v+')\\b').test(s))return 'build';
  const has=Object.keys(p.files).length>0;
  if(/^(i want|i need|i would like|i'd like|i'm building|i am building|i'm making)\b/.test(s))return has&&/\?\s*$/.test(s)?'discuss':'build';
  if(/\?\s*$/.test(s)||/^(what|why|how|when|where|who|which|should|is|are|do|does|did|explain|tell me|help me (understand|decide|think)|any (ideas|tips)|ideas|thoughts|compare|difference|pros|walk me)\b/.test(s))return 'discuss';
  return has||s.split(/\s+/).length>=6?'build':'discuss';
}
setTheme(S.theme);
if(!S.projects.length||!proj())newProj();
renderProjects();renderChat();renderFiles();preview();loadModels();tab('chat');setMode(LS.get('zx_mode','auto'));
</script>
</body>
